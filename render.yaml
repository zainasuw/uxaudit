# Render Blueprint: one free web service built from the Dockerfile.
# Secrets (GEMINI_API_KEY, REVIEW_INSTRUCTION) are entered in the Render dashboard, never stored here.
services:
  - type: web
    name: uxaudit
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: REVIEW_INSTRUCTION
        sync: false
      - key: TRUST_PROXY
        value: "1"
      - key: CHROMIUM_SANDBOX
        value: "0"
